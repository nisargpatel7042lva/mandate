specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: PermissionMirror
    network: sepolia
    source:
      # Deployed 2026-09-05, tx 0x37fb017a...
      address: "0x6f19dd6f759fac8a19579ecdefb342009a21d9a7"
      abi: PermissionMirror
      # Block containing the deploy tx — nothing to index before it
      startBlock: 11642041
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AgentScope
        - PermissionUpdate
      abis:
        - name: PermissionMirror
          file: ./abis/PermissionMirror.json
      eventHandlers:
        - event: PermissionSynced(indexed address,indexed bytes32,uint64)
          handler: handlePermissionSynced
      file: ./src/permission-mirror.ts
